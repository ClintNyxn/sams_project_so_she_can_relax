<!DOCTYPE html>
<html>
<head>
    <title>Book Appointment</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
      <div>
        <a href="index.html" class="logo">MediCare Connect</a>
      </div>

      <div>
        <a href="index.html">Home</a>
        <a href="departments.html">Departments</a>
        <a href="booking.html">Book Appointment</a>
      </div>
    </header>

    <main>
        <h1 class="title">Book an Appointment</h1>

        <p style="text-align: center;">Enter your details and select your preferred appointment date and time.</p>

        <div class="booking-container" style="margin: 30px auto; padding: 25px; border-radius: 10px;">
            <form action="confirmation.html">

                <label style="margin: 0;">Patient Name:</label><br>
                <input type="text" placeholder="Enter your name" style="width: 100%; box-sizing: border-box; margin: 6px 0; border: 1px solid teal; border-radius: 5px;" required>
                <br><br>

                <label style="margin: 0;">Age:</label><br>
                <input type="number" placeholder="Enter your age" style="width: 100%; box-sizing: border-box; margin: 6px 0; border: 1px solid teal; border-radius: 5px;" required>
                <br><br>

                <label style="margin: 0;">Gender:</label><br>
                <select style="width: 100%; box-sizing: border-box; margin: 6px 0; border: 1px solid teal; border-radius: 5px;" required>
                    <option value="">Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
                <br><br>

                <label style="margin: 0;">Contact Number:</label><br>
                <input type="tel" placeholder="Enter phone number" style="width: 100%; box-sizing: border-box; margin: 6px 0; border: 1px solid teal; border-radius: 5px;" required>
                <br><br>

                <label style="margin: 0;">Email:</label><br>
                <input type="email" placeholder="Enter email" required style="width: 100%; box-sizing: border-box; margin: 6px 0; border: 1px solid teal; border-radius: 5px;">
                <br><br>

                <label style="margin: 0;">Department:</label><br>
                <select style="width: 100%; box-sizing: border-box; margin: 6px 0; border: 1px solid teal; border-radius: 5px;" required>
                    <option value="">Select Department</option>
                    <option>Cardiology</option>
                    <option>Dermatology</option>
                    <option>General Physician</option>
                </select>
                <br><br>

                <label style="margin: 0;">Preferred Doctor:</label><br>
                <select style="width: 100%; box-sizing: border-box; margin: 6px 0; border: 1px solid teal; border-radius: 5px;" required>
                    <option value="">Select Doctor</option>
                    <option>Dr. Apoorva Jain</option>
                    <option>Dr. Vaishvi Sen</option>
                    <option>Dr. Sneha Panday</option>
                </select>
                <br><br>

                <label style="margin: 0;">Preferred Appointment Date:</label><br>
                <input type="date" style="width: 100%; box-sizing: border-box; margin: 6px 0; border: 1px solid teal; border-radius: 5px;" required>
                <br><br>

                <label style="margin: 0;">Preferred Time Slot:</label><br>
                <select style="width: 100%; box-sizing: border-box; margin: 6px 0; border: 1px solid teal; border-radius: 5px;" required>
                    <option value="">Select Time Slot</option>
                    <option>9:00 AM - 10:00 AM</option>
                    <option>10:00 AM - 11:00 AM</option>
                    <option>11:00 AM - 12:00 PM</option>
                    <option>12:00 PM - 1:00 PM</option>
                    <option>2:00 PM - 3:00 PM</option>
                    <option>3:00 PM - 4:00 PM</option>
                    <option>4:00 PM - 5:00 PM</option>
                </select>
                <br><br>

                <label style="margin: 0;">Reason for Appointment:</label><br>
                <textarea rows="4" placeholder="Enter your reason" required style="width: 100%; box-sizing: border-box; margin: 6px 0; border: 1px solid teal; border-radius: 5px;"></textarea>
                <br><br>

                <button type="submit" style="margin: 10px 0 0; border-radius: 5px; cursor: pointer;">Book Appointment</button>

            </form>
        </div>
    </main>

    <footer>
      <p>Contact: +91 987654321</p>
      <p>Email: medicare@outlook.com</p>
      <p>Address: Bareilly, Uttar Pradesh</p>
    </footer>

</body>
</html>
