<!DOCTYPE html>
<html>
<head>
    <title>Book Appointment</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="nav-container">
            <span class="logo">MediCare Connect</span>
            <a href="index.html">Home</a>
            <a href="departments.html">Departments</a>
            <a href="doctors.html">Doctors</a>
            <a href="booking.html">Book Appointment</a>
        </div>
    </header>

    <main>
        <h1 class="title">Book an Appointment</h1>

        <p>Enter your details and select your preferred appointment date and time.</p>

        <div class="booking-container">
            <form>

                <label>Patient Name:</label><br>
                <input type="text" placeholder="Enter your name" required>
                <br><br>

                <label>Age:</label><br>
                <input type="number" placeholder="Enter your age" required>
                <br><br>

                <label>Gender:</label><br>
                <select required>
                    <option value="">Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
                <br><br>

                <label>Contact Number:</label><br>
                <input type="tel" placeholder="Enter phone number" required>
                <br><br>

                <label>Email:</label><br>
                <input type="email" placeholder="Enter email">
                <br><br>

                <label>Department:</label><br>
                <select required>
                    <option value="">Select Department</option>
                    <option>Cardiology</option>
                    <option>Dermatology</option>
                    <option>General Physician</option>
                </select>
                <br><br>

                <label>Preferred Doctor:</label><br>
                <select required>
                    <option value="">Select Doctor</option>
                    <option>Dr. Apoorva Jain</option>
                    <option>Dr. Vaishvi Sen</option>
                    <option>Dr. Sneha Panday</option>
                </select>
                <br><br>

                <label>Preferred Appointment Date:</label><br>
                <input type="date" required>
                <br><br>

                <label>Preferred Time Slot:</label><br>
                <select required>
                    <option value="">Select Time Slot</option>
                    <option>9:00 AM - 10:00 AM</option>
                    <option>10:00 AM - 11:00 AM</option>
                    <option>11:00 AM - 12:00 PM</option>
                    <option>12:00 PM - 1:00 PM</option>
                    <option>2:00 PM - 3:00 PM</option>
                    <option>3:00 PM - 4:00 PM</option>
                    <option>4:00 PM - 5:00 PM</option>
                </select>
                <br><br>

                <label>Reason for Appointment:</label><br>
                <textarea rows="4" cols="35" placeholder="Enter your reason"></textarea>
                <br><br>

                <a href="confirmation.html">Book Appointment</a>

            </form>
        </div>
    </main>

    <footer>
    <p>© 2026 MediCare Connect</p>
    </footer>

</body>
</html>
